<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Recipe Collection</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* Password Lock Screen */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-box {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .auth-box input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .auth-box button {
            width: 96%;
            padding: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 0.85rem;
            display: none;
            margin-top: 10px;
        }

        /* Main Application */
        #app {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .search-bar {
            flex: 1 1 250px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            font-size: 0.95rem;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .recipe-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 4px solid var(--accent);
        }

        .recipe-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .badge {
            display: inline-block;
            background-color: #eef2f5;
            color: var(--primary);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            margin-right: 5px;
            font-weight: 600;
        }

        .badge.diet {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .recipe-details {
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .recipe-details h4 {
            margin: 10px 0 5px 0;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .recipe-details ul, .recipe-details ol {
            padding-left: 20px;
            margin: 5px 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        details summary {
            cursor: pointer;
            font-weight: bold;
            color: var(--accent);
            padding: 5px 0;
        }
    </style>
</head>
<body>

    <!-- Simple Password Protection -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>Recipe Vault</h2>
            <p>Enter your access password:</p>
            <input type="password" id="password-input" placeholder="Password">
            <button onclick="checkPassword()">Unlock</button>
            <div id="error-msg" class="error-msg">Incorrect password. Please try again.</div>
        </div>
    </div>

    <!-- Protected Main Interface -->
    <div id="app">
        <header>
            <h1>Complete Recipe Collection Index</h1>
        </header>

        <section class="controls">
            <div class="search-bar">
                <input type="text" id="search" placeholder="Search recipe or ingredient..." oninput="filterRecipes()">
            </div>
            <div class="filter-group">
                <select id="category-filter" onchange="filterRecipes()">
                    <option value="All">All Categories</option>
                    <option value="Appetizers & Snacks">Appetizers & Snacks</option>
                    <option value="Salads">Salads</option>
                    <option value="Soups & Stews">Soups & Stews</option>

                    <option value="Main Dishes (Poultry)">Main Dishes (Poultry)</option>
                    <option value="Vegetarian & Seafood">Vegetarian & Seafood</option>
                    <option value="Side Dishes & Breads">Side Dishes & Breads</option>
                    <option value="Desserts & Sweets">Desserts & Sweets</option>
                    <option value="Sauces, Dips & Rubs">Sauces, Dips & Rubs</option>
                </select>

                <select id="diet-filter" onchange="filterRecipes()">
                    <option value="All">All Dietary Types</option>
                    <option value="Keto/Low-Carb">Keto / Low-Carb</option>
                    <option value="Gluten-Free">Gluten-Free</option>
                    <option value="Vegetarian">Vegetarian</option>
                </select>
            </div>
        </section>

        <main class="recipe-grid" id="recipe-list">
            <!-- Cards injected via JavaScript -->
        </main>
    </div>

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');
            if (input === ACCESS_PASSWORD) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                renderRecipes(recipes);
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById("password-input").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });

        function renderRecipes(items) {
            const container = document.getElementById('recipe-list');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p>No recipes match your criteria.</p>';
                return;
            }

            items.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                const tagsHtml = recipe.tags.map(tag => `<span class="badge diet">${tag}</span>`).join('');
                const ingList = recipe.ingredients.map(ing => `<li>${ing}</li>`).join('');
                const stepList = recipe.instructions.map(step => `<li>${step}</li>`).join('');

                card.innerHTML = `
                    <div>
                        <h3>${recipe.name}</h3>
                        <span class="badge">${recipe.category}</span>
                        <div style="margin-top: 8px;">${tagsHtml}</div>
                    </div>
                    <div class="recipe-details">
                        <details>
                            <summary>View Ingredients & Instructions</summary>
                            <h4>Ingredients:</h4>
                            <ul>${ingList}</ul>
                            <h4>Instructions:</h4>
                            <ol>${stepList}</ol>
                        </details>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterRecipes() {
            const query = document.getElementById('search').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const diet = document.getElementById('diet-filter').value;

            const filtered = recipes.filter(recipe => {
                const matchesSearch = recipe.name.toLowerCase().includes(query) || 
                                     recipe.ingredients.some(i => i.toLowerCase().includes(query));
                const matchesCategory = category === 'All' || recipe.category === category;
                const matchesDiet = diet === 'All' || recipe.tags.includes(diet);

                return matchesSearch && matchesCategory && matchesDiet;
            });

            renderRecipes(filtered);
        }
    </script>
